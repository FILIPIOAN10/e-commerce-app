groups:
  - name: ecommerce
    rules:
      - alert: HighErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: High 5xx error rate

      - alert: HighLatencyP95
        expr: histogram_quantile(0.95, rate(http_server_requests_seconds_bucket[5m])) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: p95 latency above 500ms

      - alert: DatabaseConnectionPoolHigh
        expr: hikaricp_connections_active / hikaricp_connections_max > 0.8
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Database connection pool usage above 80%

      - alert: JVMMemoryUsageHigh
        expr: jvm_memory_used_bytes / jvm_memory_max_bytes > 0.85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: JVM memory usage above 85%

      - alert: FailedLoginBruteForce
        expr: rate(security_failed_logins_total[5m]) > 0.2
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Possible brute-force attack - high failed login rate
