global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - 'alert-rules.yml'

scrape_configs:
  - job_name: 'ecommerce-backend'
    metrics_path: '/actuator/prometheus'
    # /actuator/prometheus is not public — see actuatorFilterChain. This is the
    # local-profile credential, matching the dev default in
    # application-local.properties, in the same spirit as the dummy Stripe and
    # OAuth keys: it exists so `--profile monitoring` works out of the box and
    # is not a secret. A real deployment sets METRICS_SCRAPE_PASSWORD on the
    # backend and mounts its own prometheus.yml with the matching value.
    basic_auth:
      username: 'prometheus'
      password: 'dummy-scrape-password'
    static_configs:
      - targets: ['backend:8080']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
