global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - 'alert-rules.yml'

scrape_configs:
  - job_name: 'ecommerce-backend'
    metrics_path: '/actuator/prometheus'
    # /actuator/prometheus is not public — see actuatorFilterChain. The password
    # is mounted as a file from METRICS_SCRAPE_PASSWORD rather than written
    # here, so no credential is committed.
    basic_auth:
      username: 'prometheus'
      password_file: /etc/prometheus/scrape_password
    static_configs:
      - targets: ['backend:8080']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
