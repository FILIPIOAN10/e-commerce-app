version: 2

updates:
  # Maven dependencies
  - package-ecosystem: "maven"
    directory: "/ecom-backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    ignore:
      # 3.x validates against com.networknt:json-schema-validator, which Spring AI
      # already pins to 3.0.1 with an incompatible API - the bump compiles but dies
      # at runtime with NoSuchMethodError. 2.x uses java-json-tools and does not
      # collide. Patches within 2.x are still welcome.
      - dependency-name: "com.atlassian.oai:*"
        update-types: ["version-update:semver-major"]

  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/ecom-frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    groups:
      # vitest and @vitest/coverage-v8 are version-locked: coverage-v8 declares a
      # peer of the *exact* vitest version, so a lone coverage bump produces a
      # tree npm refuses to install (ERESOLVE, "peer vitest@5.0.0 ... Found:
      # vitest@4.1.11") and CI fails on npm ci before a single test runs. Grouped
      # so the pair always moves in one PR.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
    ignore:
      # @vitejs/plugin-react 6.x requires vite ^8; this app is on vite 7. Lift this
      # together with the Vite 8 upgrade, not before - the mismatched pair produced
      # a lockfile npm ci refuses to install.
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
