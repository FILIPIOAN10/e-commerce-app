name: Deploy to Production

on:
  push:
    tags:
      - 'v*'

# One production deployment at a time. Two tags pushed close together would
# otherwise race on the same host over .env, .env.previous and the compose
# stack. cancel-in-progress stays false on purpose: cancelling a deployment
# midway is how you get a half-applied stack with no rollback.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/ecommerce

jobs:
  build-and-push:
    name: Build & Push Images
    uses: ./.github/workflows/build-push.yml

  deploy:
    name: Deploy
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Announce deployment
        run: |
          echo "Deploying version ${{ github.ref_name }}"
          echo "Backend image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ github.ref_name }}"
          echo "Frontend image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:${{ github.ref_name }}"

      - name: Check deployment secrets
        id: check
        run: |
          if [ -n "${{ secrets.DEPLOY_HOST }}" ] && [ -n "${{ secrets.DEPLOY_USER }}" ] && [ -n "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      # Requires repo secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (and optional DEPLOY_PATH,
      # default /opt/ecommerce) pointing at a host with docker compose + the production compose file.
      - name: Deploy over SSH
        if: steps.check.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: REGISTRY,IMAGE_PREFIX
          script: |
            set -e
            DEPLOY_DIR="${DEPLOY_PATH:-/opt/ecommerce}"
            cd "$DEPLOY_DIR"

            BACKEND_TAG="${REGISTRY}/${IMAGE_PREFIX}-backend:${{ github.ref_name }}"
            FRONTEND_TAG="${REGISTRY}/${IMAGE_PREFIX}-frontend:${{ github.ref_name }}"

            # Keep a copy of the previous production .env so we can roll back.
            cp .env .env.previous

            # Point compose to the newly pushed images.
            sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=${BACKEND_TAG}|" .env
            sed -i "s|^FRONTEND_IMAGE=.*|FRONTEND_IMAGE=${FRONTEND_TAG}|" .env

            # Pull and start the new stack.
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Health gate: wait up to 2 minutes for the backend to report UP.
            # Through nginx on :80, not the backend on :8080. docker-compose.prod.yml
            # publishes ports for nginx alone — the backend is reachable only inside
            # the compose network — so :8080 on the host answered nothing, every
            # attempt scored 000, and the gate rolled back and failed a deployment
            # that was in fact healthy. nginx proxies /actuator/health straight
            # through, and a 502 while the backend is still coming up simply retries.
            echo "Waiting for /actuator/health ..."
            HEALTHY=false
            for i in $(seq 1 24); do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/actuator/health || echo "000")
              if [ "$CODE" = "200" ]; then
                HEALTHY=true
                echo "Health check passed (HTTP 200)"
                break
              fi
              echo "Attempt $i: HTTP $CODE, retrying in 5s ..."
              sleep 5
            done

            if [ "$HEALTHY" = "false" ]; then
              echo "::error::Health check failed. Rolling back to previous images."
              cp .env.previous .env
              docker compose -f docker-compose.prod.yml down
              docker compose -f docker-compose.prod.yml up -d --remove-orphans
              exit 1
            fi

            # Only prune unused images after the deployment is healthy.
            docker image prune -f

      - name: Deployment secrets missing
        if: steps.check.outputs.configured == 'false'
        run: |
          echo "::warning::DEPLOY_HOST, DEPLOY_USER or DEPLOY_SSH_KEY repo secrets are not configured. Skipping real deployment for ${{ github.ref_name }}. Images were still pushed to GHCR."
