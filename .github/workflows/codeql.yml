name: CodeQL
on:
  push:
    branches: [main, 'feat/**', 'feature/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java, javascript]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        if: matrix.language == 'java'
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      # CodeQL traces whichever javac invocations the build makes, so the
      # launcher is free to change: the wrapper pins Maven 3.9.9 the way every
      # other workflow does, instead of taking whatever the runner image ships.
      - name: Build Java (backend)
        if: matrix.language == 'java'
        working-directory: ecom-backend
        run: bash mvnw -B -DskipTests package

      # selenium-tests has no wrapper of its own, so this one stays on the
      # runner's Maven.
      - name: Build Java (selenium tests)
        if: matrix.language == 'java'
        run: mvn -B -f selenium-tests/pom.xml -DskipTests test-compile

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
