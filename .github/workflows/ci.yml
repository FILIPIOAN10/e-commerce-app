name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  #  Backend: compile → test (Testcontainers) → JaCoCo
  # ─────────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests with Testcontainers
        working-directory: ecom-backend
        run: bash mvnw test -B -Dspring.profiles.active=test

      - name: Generate JaCoCo coverage report
        working-directory: ecom-backend
        run: bash mvnw jacoco:report -B

      - name: Verify coverage threshold (>= 60% service layer)
        working-directory: ecom-backend
        run: bash mvnw verify -B -DskipTests

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: ecom-backend/target/site/jacoco/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: ecom-backend/target/surefire-reports/
          retention-days: 7

  # ─────────────────────────────────────────────
  #  Frontend: install → lint → test (Vitest) → build
  # ─────────────────────────────────────────────
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: ecom-frontend
        run: npm install

      - name: Lint (non-blocking)
        working-directory: ecom-frontend
        continue-on-error: true
        run: npm run lint

      - name: Run Vitest
        working-directory: ecom-frontend
        run: npm run test

      - name: Build
        working-directory: ecom-frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: ecom-frontend/dist/
          retention-days: 7

  # ─────────────────────────────────────────────
  #  E2E: Playwright (needs backend + frontend running)
  # ─────────────────────────────────────────────
  e2e-test:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Playwright dependencies
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Create .env for Docker Compose
        run: |
          echo "POSTGRES_DB=ecommerce" > .env
          echo "POSTGRES_USER=postgres" >> .env
          echo "POSTGRES_PASSWORD=postgres" >> .env
          echo "VAULT_TOKEN=root" >> .env

      - name: Create .env for frontend
        working-directory: ecom-frontend
        run: |
          echo "VITE_BACK_END_URL=http://localhost:8080" > .env

      - name: Start infrastructure (Postgres + Redis)
        run: |
          docker compose up -d postgres redis
          sleep 10

      - name: Start backend
        working-directory: ecom-backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/ecommerce
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_DATA_REDIS_HOST: localhost
          JWT_SECRET: ci-test-secret-key-for-jwt-signing-at-least-32-chars
          SPRING_PROFILES_ACTIVE: ci
        run: |
          bash mvnw spring-boot:run -B > backend.log 2>&1 &
          sleep 60

      - name: Wait for backend to be ready
        run: |
          echo "Waiting for backend..."
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/public/products || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "Backend is up (HTTP $CODE)"
              exit 0
            fi
            echo "Attempt $i: HTTP $CODE, retrying..."
            sleep 5
          done
          echo "Backend failed to start"
          echo "=== Last 100 lines of backend log ==="
          tail -100 ecom-backend/backend.log
          exit 1

      - name: Upload backend logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-logs
          path: ecom-backend/backend.log
          retention-days: 7

      - name: Start frontend
        working-directory: ecom-frontend
        run: |
          npm install
          npm run dev &
          sleep 10

      - name: Run Playwright tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload Playwright videos
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-videos
          path: e2e/test-results/
          retention-days: 7
