name: CI

on:
  push:
    branches: [main, 'feat/**', 'feature/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege, matching build-push.yml, codeql.yml and deploy.yml. Nothing
# in CI writes to the repository: it reads code, runs tests and uploads
# artifacts, none of which needs more than this.
permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────
  #  Backend: compile → test (Testcontainers) → JaCoCo
  # ─────────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    # Without this a wedged Testcontainers pull sits at the 6h runner default.
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests with Testcontainers
        working-directory: ecom-backend
        run: bash mvnw test -B -Dspring.profiles.active=test

      # The coverage gate stays a separate step so a regression in it fails
      # distinctly from a test failure. It does NOT need `verify`: the report is
      # already written by the jacoco `report` execution bound to the test phase,
      # and `verify -DskipTests` re-ran compile and package on the way to the
      # check — assembling a Spring Boot fat JAR this job never uses, since
      # build-push.yml builds the real one. Invoking the execution by id runs the
      # same rule against the same jacoco.exec and nothing else.
      - name: Verify coverage threshold (>= 60% service layer)
        working-directory: ecom-backend
        run: bash mvnw jacoco:check@check-service-layer -B

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: ecom-backend/target/site/jacoco/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-results
          path: ecom-backend/target/surefire-reports/
          retention-days: 7

  # ─────────────────────────────────────────────
  #  Frontend: install → lint → test (Vitest) → build
  # ─────────────────────────────────────────────
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ecom-frontend/package-lock.json

      - name: Install dependencies
        working-directory: ecom-frontend
        run: npm ci

      - name: Lint
        working-directory: ecom-frontend
        run: npm run lint

      - name: Run Vitest
        working-directory: ecom-frontend
        run: npm run test

      - name: Build
        working-directory: ecom-frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: ecom-frontend/dist/
          retention-days: 7

  # ─────────────────────────────────────────────
  #  E2E: Playwright (needs backend + frontend running)
  # ─────────────────────────────────────────────
  e2e-test:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    timeout-minutes: 45
    container:
      # Must track the @playwright/test version in e2e/package-lock.json: the
      # browsers are baked into the image and refuse a mismatched client.
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user root

    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16-trixie
        env:
          POSTGRES_DB: ecommerce
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ecommerce"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # The browsers ship inside the container image; the client comes from the
      # lockfile. Nothing ties the two together, and they had already drifted
      # thirteen minors apart once — the image pinned to v1.49.0 while Dependabot
      # moved the lockfile to 1.62.1, papered over by a forced downgrade at
      # install time. Left to fail on its own the symptom is a missing-executable
      # error deep in the run, so compare them here where the message can say
      # what to change.
      - name: Playwright image and lockfile must agree
        run: |
          IMAGE_LINE='^[[:space:]]*image:[[:space:]]*mcr\.microsoft\.com/playwright:v[0-9]+\.[0-9]+\.[0-9]+'
          IMAGE=$(grep -oE "$IMAGE_LINE" .github/workflows/ci.yml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          LOCK=$(node -p "require('./e2e/package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "container image: v$IMAGE"
          echo "lockfile:        $LOCK"
          if [ "$IMAGE" != "$LOCK" ]; then
            echo "::error file=.github/workflows/ci.yml::Playwright drift: the e2e container is v$IMAGE but e2e/package-lock.json resolves @playwright/test to $LOCK. Browsers ship with the image and will not match this client. Set the container image to mcr.microsoft.com/playwright:v$LOCK-noble, or pin the lockfile back to $IMAGE."
            exit 1
          fi

      - name: Create .env for frontend
        working-directory: ecom-frontend
        run: |
          echo "VITE_BACK_END_URL=http://localhost:8080" > .env

      - name: Create CI .env
        id: create-env
        run: |
          JWT_SECRET=$(node -e "console.log(require('crypto').randomBytes(48).toString('base64'))")
          echo "jwt_secret=$JWT_SECRET" >> "$GITHUB_OUTPUT"
          echo "POSTGRES_DB=ecommerce" > .env
          echo "POSTGRES_USER=postgres" >> .env
          echo "POSTGRES_PASSWORD=postgres" >> .env
          echo "VAULT_TOKEN=root" >> .env
          echo "JWT_SECRET=$JWT_SECRET" >> .env
          echo "STRIPE_SECRET_KEY=dummy" >> .env
          echo "STRIPE_WEBHOOK_SECRET=dummy" >> .env

      # Was `npm install` followed by a forced downgrade to @playwright/test@1.49.0
      # to match the old container. The lockfile had meanwhile moved to 1.62.1, so
      # CI tested against a Playwright thirteen minors behind the one developers
      # run locally. The image now matches the lockfile, so `npm ci` is the whole
      # story and there is one version to bump instead of three.
      - name: Install e2e deps
        working-directory: e2e
        run: |
          npm ci
          npm install --no-save maildev

      - name: Start fake SMTP server
        working-directory: e2e
        run: |
          npx maildev --smtp 1025 --ip 127.0.0.1 > smtp.log 2>&1 &
          sleep 3

      - name: Build and start backend
        working-directory: ecom-backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ecommerce
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_DATA_REDIS_HOST: redis
          JWT_SECRET: ${{ steps.create-env.outputs.jwt_secret }}
          SPRING_PROFILES_ACTIVE: ci
        run: |
          # No `clean`: the runner is fresh, there is nothing to remove.
          bash mvnw -B package -DskipTests
          java -jar target/*.jar > backend.log 2>&1 &

      - name: Wait for backend to be ready
        run: |
          echo "Waiting for backend..."
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/public/products || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "Backend is up (HTTP $CODE)"
              exit 0
            fi
            echo "Attempt $i: HTTP $CODE, retrying..."
            sleep 5
          done
          echo "Backend failed to start"
          echo "=== Last 100 lines of backend log ==="
          tail -100 ecom-backend/backend.log
          exit 1

      - name: Smoke test login endpoint
        run: |
          echo "=== POST /api/auth/signin ==="
          curl -i -s -X POST http://localhost:8080/api/auth/signin \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"adminPass"}'
          echo ""

      - name: Smoke test signup endpoint
        run: |
          echo "=== POST /api/auth/signup ==="
          curl -i -s -X POST http://localhost:8080/api/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"username":"smokeuser_ci","email":"smokeuser_ci@test.com","password":"testpass123","passwordHint":"my hint","roles":["ROLE_USER"]}'
          echo ""
          echo "=== Backend log (last 40 lines) ==="
          tail -40 ecom-backend/backend.log

      - name: Upload backend logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-logs
          path: ecom-backend/backend.log
          retention-days: 7

      - name: Start frontend
        working-directory: ecom-frontend
        run: |
          npm ci
          npm run dev &
          sleep 10

      - name: Run Playwright tests
        working-directory: e2e
        env:
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload Playwright videos
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-videos
          path: e2e/test-results/
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # gitleaks writes a job summary and dependency-review annotates the pull
      # request it runs on. Spelled out rather than inherited, so tightening the
      # workflow default above cannot quietly disarm either scanner.
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21 + Maven cache
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Not redundant, despite Trivy being able to reach Maven Central itself.
      # Trivy resolves a pom.xml against ~/.m2/repository first and only falls
      # back to remote; when a lookup fails it "uses an empty version" and then
      # "doesn't detect child dependencies for dependencies without a version".
      # A transient fetch failure would therefore quietly shrink the scan rather
      # than fail it — the worst outcome for a security gate. setup-java above
      # restores ~/.m2 from cache, so on a warm run this is close to a no-op.
      - name: Populate ~/.m2 so Trivy resolves offline
        working-directory: ecom-backend
        run: bash mvnw -B dependency:go-offline

      - name: Secret scan with gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_CACHE_DIR: /home/runner/.cache/trivy
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          format: 'table'
          skip-dirs: 'ecom-frontend/node_modules,ecom-backend/target,e2e/node_modules'

      # Ran on pull requests only, and work lands here by pushing straight to
      # main — so in practice this scanner had never executed once. The action
      # defaults to a PR's own base and head; on a push there is no PR, so the
      # two ends of the diff have to be named explicitly.
      #
      # Skipped when github.event.before is the all-zero SHA, which is what a
      # branch's first push or a force-push reports: there is no previous commit
      # to diff against and the action would fail rather than find nothing.
      - name: Dependency review
        if: >-
          github.event_name == 'pull_request' ||
          github.event.before != '0000000000000000000000000000000000000000'
        uses: actions/dependency-review-action@v5
        with:
          base-ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          head-ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Deliberately stricter than the Trivy gate above, which fails only on
          # CRITICAL/HIGH. The two are not measuring the same thing: Trivy scans
          # everything already in the tree, where a moderate finding may be
          # unreachable or unfixable and blocking on it would be noise. This one
          # sees only what a push newly introduces, and declining to add a known
          # moderate vulnerability is cheap at exactly that moment.
          fail-on-severity: moderate
