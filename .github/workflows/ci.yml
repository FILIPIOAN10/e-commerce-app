name: CI

on:
  push:
    branches: [main, 'feat/**', 'feature/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  #  Backend: compile → test (Testcontainers) → JaCoCo
  # ─────────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests with Testcontainers
        working-directory: ecom-backend
        run: bash mvnw test -B -Dspring.profiles.active=test

      - name: Generate JaCoCo coverage report
        working-directory: ecom-backend
        run: bash mvnw jacoco:report -B

      - name: Verify coverage threshold (>= 60% service layer)
        working-directory: ecom-backend
        run: bash mvnw verify -B -DskipTests

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: ecom-backend/target/site/jacoco/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: ecom-backend/target/surefire-reports/
          retention-days: 7

  # ─────────────────────────────────────────────
  #  Frontend: install → lint → test (Vitest) → build
  # ─────────────────────────────────────────────
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: ecom-frontend
        run: npm ci

      - name: Lint
        working-directory: ecom-frontend
        run: npm run lint

      - name: Run Vitest
        working-directory: ecom-frontend
        run: npm run test

      - name: Build
        working-directory: ecom-frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ecom-frontend/dist/
          retention-days: 7

  # ─────────────────────────────────────────────
  #  E2E: Playwright (needs backend + frontend running)
  # ─────────────────────────────────────────────
  e2e-test:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.49.0-noble
      options: --user root

    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16-trixie
        env:
          POSTGRES_DB: ecommerce
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ecommerce"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Create .env for frontend
        working-directory: ecom-frontend
        run: |
          echo "VITE_BACK_END_URL=http://localhost:8080" > .env

      - name: Create CI .env
        id: create-env
        run: |
          JWT_SECRET=$(node -e "console.log(require('crypto').randomBytes(48).toString('base64'))")
          echo "jwt_secret=$JWT_SECRET" >> "$GITHUB_OUTPUT"
          echo "POSTGRES_DB=ecommerce" > .env
          echo "POSTGRES_USER=postgres" >> .env
          echo "POSTGRES_PASSWORD=postgres" >> .env
          echo "VAULT_TOKEN=root" >> .env
          echo "JWT_SECRET=$JWT_SECRET" >> .env
          echo "STRIPE_SECRET_KEY=dummy" >> .env
          echo "STRIPE_WEBHOOK_SECRET=dummy" >> .env

      - name: Install e2e deps and pin Playwright version
        working-directory: e2e
        run: |
          npm install
          npm install --no-save @playwright/test@1.49.0 maildev

      - name: Start fake SMTP server
        working-directory: e2e
        run: |
          npx maildev --smtp 1025 --ip 127.0.0.1 > smtp.log 2>&1 &
          sleep 3

      - name: Build and start backend
        working-directory: ecom-backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ecommerce
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          SPRING_DATA_REDIS_HOST: redis
          JWT_SECRET: ${{ steps.create-env.outputs.jwt_secret }}
          SPRING_PROFILES_ACTIVE: ci
        run: |
          bash mvnw -B clean package -DskipTests
          java -jar target/*.jar > backend.log 2>&1 &
          sleep 10

      - name: Wait for backend to be ready
        run: |
          echo "Waiting for backend..."
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/public/products || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "Backend is up (HTTP $CODE)"
              exit 0
            fi
            echo "Attempt $i: HTTP $CODE, retrying..."
            sleep 5
          done
          echo "Backend failed to start"
          echo "=== Last 100 lines of backend log ==="
          tail -100 ecom-backend/backend.log
          exit 1

      - name: Smoke test login endpoint
        run: |
          echo "=== POST /api/auth/signin ==="
          curl -i -s -X POST http://localhost:8080/api/auth/signin \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"adminPass"}'
          echo ""

      - name: Smoke test signup endpoint
        run: |
          echo "=== POST /api/auth/signup ==="
          curl -i -s -X POST http://localhost:8080/api/auth/signup \
            -H "Content-Type: application/json" \
            -d '{"username":"smokeuser_ci","email":"smokeuser_ci@test.com","password":"testpass123","passwordHint":"my hint","roles":["ROLE_USER"]}'
          echo ""
          echo "=== Backend log (last 40 lines) ==="
          tail -40 ecom-backend/backend.log

      - name: Upload backend logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: ecom-backend/backend.log
          retention-days: 7

      - name: Start frontend
        working-directory: ecom-frontend
        run: |
          npm ci
          npm run dev &
          sleep 10

      - name: Run Playwright tests
        working-directory: e2e
        env:
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload Playwright videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos
          path: e2e/test-results/
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21 + Maven cache
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Download Maven dependencies
        working-directory: ecom-backend
        run: ./mvnw -B dependency:go-offline

      - name: Secret scan with gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_CACHE_DIR: /home/runner/.cache/trivy
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
          format: 'table'
          skip-dirs: 'ecom-frontend/node_modules,ecom-backend/target,e2e/node_modules'

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        continue-on-error: true
