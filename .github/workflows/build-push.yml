name: Build & Push Docker Images

on:
  workflow_call:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/ecommerce

jobs:
  build-backend:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build JAR
        working-directory: ecom-backend
        run: ./mvnw package -B -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build & push backend image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./ecom-backend
          file: ./ecom-backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scanned by digest, not by steps.meta.outputs.tags: that output is one tag
      # per line whenever more than one pattern matches (a real release matches
      # all three configured here — {{version}}, {{major}}.{{minor}}, latest — so
      # this is not a corner case), and Trivy's image-ref takes exactly one
      # reference. Handed the multi-line blob, it tried to parse a reference
      # containing a literal newline and failed outright:
      #   FATAL  Fatal error  run error: ... could not parse reference:
      #   ghcr.io/.../ecommerce-backend:0.0.1-test (newline) ghcr.io/.../ecommerce-backend:latest
      # First seen on v0.0.1-test, the first tag ever pushed to this repo — every
      # prior push had gone to a branch, which build-push.yml is never called
      # for. A digest is one value regardless of how many tags point at it, and
      # names the exact image this job just pushed rather than whichever tag a
      # concurrent build might move next.
      - name: Run Trivy scan on backend image
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_CACHE_DIR: /home/runner/.cache/trivy
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend@${{ steps.build.outputs.digest }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

  build-frontend:
    name: Build & Push Frontend Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build & push frontend image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./ecom-frontend
          file: ./ecom-frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_BACK_END_URL=${{ vars.VITE_BACK_END_URL || '/api' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # See the backend job for why this is a digest and not steps.meta.outputs.tags.
      - name: Run Trivy scan on frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_CACHE_DIR: /home/runner/.cache/trivy
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend@${{ steps.build.outputs.digest }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
