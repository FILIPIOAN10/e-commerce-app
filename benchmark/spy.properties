# ============================================================
#  P6SPY — Configurare pentru monitorizarea query-urilor SQL
#  Locație: src/main/resources/spy.properties
# ============================================================

# Logger — scrie în SLF4J (apare în consola Spring Boot)
appender=com.p6spy.engine.spy.appender.Slf4JLogger

# Format: timp_executie | query SQL
logMessageFormat=com.p6spy.engine.spy.appender.CustomLineFormat
customLogMessageFormat=%(executionTime)ms | %(sqlSingleLine)

# Activează filtrarea
filter=true

# Loghează doar query-urile mai lente de 50ms
# Pune 0 ca să le vezi pe toate (util la start pentru audit)
executionThreshold=50

# Exclude query-urile de health check / ping
excludecategories=info,debug,result,resultset,batch

# Driver-ul real PostgreSQL pe care îl wrappuiești
driverlist=org.postgresql.Driver