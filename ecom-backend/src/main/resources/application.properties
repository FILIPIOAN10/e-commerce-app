spring.application.name=sb-ecom
spring.cache.type=redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.username=${SPRING_DATA_REDIS_USERNAME:}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}

# Postgres Sql
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/ecommerce}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
# No default: the password must be supplied via environment variable or Vault.
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# Flyway owns the schema; Hibernate only validates entity/table agreement.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.h2.console.enabled=false

# --- JPA / Hibernate performance ---
# Keep the persistence context out of the view layer: prevents connections being
# held for the whole request and surfaces lazy-loading bugs instead of hiding them.
spring.jpa.open-in-view=false
# Batch inserts/updates so saveAll() does not issue one statement per row.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true

# --- Connection pool (HikariCP) ---
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# --- Server ---
server.shutdown=graceful
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,application/javascript
server.compression.min-response-size=1024

# --- Flyway (schema versioning) ---
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
# Adopts a pre-existing (Hibernate-generated) schema: it is stamped at
# version 1 so V1 is skipped and migration continues from V2 onwards.
# A fresh database is empty, so it runs V1 normally instead.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing schema adopted from hibernate ddl-auto
spring.flyway.validate-on-migrate=true

project.image=images/

# How long a checkout stock reservation is held. Duration syntax: 10m, 90s, ...
inventory.reservation.ttl=10m

# --- Async executor for order-lifecycle side effects (see AsyncConfig) ---
# Bounded on purpose: once the queue and all max threads are busy, the caller
# runs the task (CallerRunsPolicy) instead of the pool growing without limit.
app.async.order-events.core-pool-size=${ORDER_EVENTS_CORE_POOL_SIZE:2}
app.async.order-events.max-pool-size=${ORDER_EVENTS_MAX_POOL_SIZE:5}
app.async.order-events.queue-capacity=${ORDER_EVENTS_QUEUE_CAPACITY:100}
app.async.order-events.await-termination-seconds=${ORDER_EVENTS_AWAIT_TERMINATION_SECONDS:30}

# --- Transactional outbox (durable order side effects, see service.outbox) ---
# The order-email listeners enqueue a row in the checkout transaction; this
# poller drains it, retrying with exponential backoff and dead-lettering after
# max-attempts. FOR UPDATE SKIP LOCKED makes running >1 instance safe.
app.outbox.enabled=${OUTBOX_ENABLED:true}
app.outbox.poll-interval-ms=${OUTBOX_POLL_INTERVAL_MS:5000}
app.outbox.initial-delay-ms=${OUTBOX_INITIAL_DELAY_MS:15000}
app.outbox.batch-size=${OUTBOX_BATCH_SIZE:20}
app.outbox.max-batches-per-tick=${OUTBOX_MAX_BATCHES_PER_TICK:10}
app.outbox.max-attempts=${OUTBOX_MAX_ATTEMPTS:8}
app.outbox.base-backoff-seconds=${OUTBOX_BASE_BACKOFF_SECONDS:30}

# --- Abandoned-cart recovery (see service.cart) ---
# A sweep finds non-empty carts inactive past a stage window whose owner opted
# in, and enqueues one reminder per (cart, stage) through the outbox. Guarded by
# a Postgres advisory lock so only one instance sweeps at a time.
app.abandoned-cart.enabled=${ABANDONED_CART_ENABLED:true}
app.abandoned-cart.sweep-interval-ms=${ABANDONED_CART_SWEEP_INTERVAL_MS:900000}
app.abandoned-cart.initial-delay-ms=${ABANDONED_CART_INITIAL_DELAY_MS:60000}
app.abandoned-cart.page-size=${ABANDONED_CART_PAGE_SIZE:100}
app.abandoned-cart.max-reminders-per-sweep=${ABANDONED_CART_MAX_PER_SWEEP:500}
app.abandoned-cart.recent-order-cutoff-days=${ABANDONED_CART_RECENT_ORDER_CUTOFF_DAYS:4}
app.abandoned-cart.recovery-token-ttl-hours=${ABANDONED_CART_RECOVERY_TOKEN_TTL_HOURS:168}

# --- Promo campaigns (see PromoCampaignServiceImpl) ---
# Applies a campaign's discount to its products when it starts and puts the
# original price back when it ends. Idempotent per campaign (promo_campaigns.
# applied), so a steady state costs two SELECTs that return nothing rather than
# rewriting every product on every tick. Guarded by an advisory lock.
app.promo.enabled=${PROMO_SWEEP_ENABLED:true}
app.promo.sweep-interval-ms=${PROMO_SWEEP_INTERVAL_MS:60000}
app.promo.sweep-initial-delay-ms=${PROMO_SWEEP_INITIAL_DELAY_MS:30000}

# --- Stock ledger (see service.stock) ---
# Every change to products.quantity also appends a stock_movement row, so
# SUM(delta) per product must equal products.quantity. This sweep logs any
# product where that stopped being true — i.e. a write that bypassed the ledger.
app.stock.reconciliation-enabled=${STOCK_RECONCILIATION_ENABLED:true}
app.stock.reconciliation-interval-ms=${STOCK_RECONCILIATION_INTERVAL_MS:3600000}
app.stock.reconciliation-initial-delay-ms=${STOCK_RECONCILIATION_INITIAL_DELAY_MS:300000}

# --- VAT / tax (see service.pricing.rule.VatRule) ---
# The last rule in the pricing pipeline adds a VAT line, charged on the
# post-discount total (plus shipping, per EU practice) at a rate looked up from
# the delivery-address country. app.tax.rates.<ISO> overrides per country;
# app.tax.default-rate-percent covers everywhere else. app.tax.enabled=false
# drops the line entirely — for a VAT-inclusive market, or one the store is not
# registered to charge in. Rates are percentages: 19 means 19%.
app.tax.enabled=${TAX_ENABLED:true}
app.tax.default-rate-percent=${TAX_DEFAULT_RATE_PERCENT:0}
app.tax.taxable-shipping=${TAX_TAXABLE_SHIPPING:true}
app.tax.rates.RO=${TAX_RATE_RO:19}
app.tax.rates.DE=${TAX_RATE_DE:19}
app.tax.rates.FR=${TAX_RATE_FR:20}

# --- GDPR (see service.gdpr and docs/gdpr.md) ---
# An Art. 15 export is built by the outbox and handed over as a single-use link;
# the archive is a full copy of one person's data, so it is deleted again as soon
# as the TTL passes. The erasure confirmation link is short-lived because it
# authorises an irreversible deletion.
app.gdpr.export-ttl-days=${GDPR_EXPORT_TTL_DAYS:7}
app.gdpr.erasure-token-ttl-minutes=${GDPR_ERASURE_TOKEN_TTL_MINUTES:60}
app.gdpr.purge-enabled=${GDPR_PURGE_ENABLED:true}
app.gdpr.purge-interval-ms=${GDPR_PURGE_INTERVAL_MS:3600000}
app.gdpr.purge-initial-delay-ms=${GDPR_PURGE_INITIAL_DELAY_MS:120000}

# Supplied by Vault (spring.app.jwtSecret) or the JWT_SECRET environment variable.
# No default — the application refuses to start if the secret is not provided.
spring.app.jwtSecret=${JWT_SECRET}
spring.app.jwtExpirationMs=${JWT_EXPIRATION_MS:900000}
spring.ecom.app.jwtCookieName=springBootEcom
spring.ecom.app.refreshTokenCookieName=springBootEcomRefresh
spring.app.refreshTokenExpirationMs=${JWT_REFRESH_EXPIRATION_MS:604800000}

frontend.url=${FRONTEND_URL:http://localhost:5173}
image.base.url=${IMAGE_BASE_URL:http://localhost:8080/images}

# Semantic product search
app.search.semantic.enabled=${APP_SEARCH_SEMANTIC_ENABLED:false}
app.search.semantic.top-k=${APP_SEARCH_SEMANTIC_TOP_K:20}
app.search.semantic.similarity-threshold=${APP_SEARCH_SEMANTIC_SIMILARITY_THRESHOLD:0.50}
spring.ai.model.embedding=${SPRING_AI_MODEL_EMBEDDING:none}
spring.ai.vectorstore.type=${SPRING_AI_VECTORSTORE_TYPE:none}
spring.ai.model.chat=${SPRING_AI_MODEL_CHAT:none}
spring.ai.model.image=${SPRING_AI_MODEL_IMAGE:none}
spring.ai.model.moderation=${SPRING_AI_MODEL_MODERATION:none}
spring.ai.model.chat.audio.speech=${SPRING_AI_MODEL_AUDIO_SPEECH:none}
spring.ai.model.chat.audio.transcription=${SPRING_AI_MODEL_AUDIO_TRANSCRIPTION:none}
spring.ai.openai.embedding.option.model=text-embedding-3-small
spring.ai.vectorstore.pgvector.initialize-schema=${SPRING_AI_VECTORSTORE_PGVECTOR_INITIALIZE_SCHEMA:true}
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.table-name=product_vector_store
spring.ai.openai.audio.speech.enabled=false

# Seed data now lives in Flyway migrations, not data.sql.
spring.sql.init.mode=${SQL_INIT_MODE:never}


spring.security.oauth2.client.registration.github.scope=read:user,user:email

# --- Multipart file upload ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# --- Spring Cloud Vault Configuration ---
# Vault import is in application-dev.properties to avoid loading
# the vault resolver during tests (incompatible with Spring Boot 4.x).
spring.cloud.vault.scheme=http
spring.cloud.vault.uri=${SPRING_CLOUD_VAULT_URI:http://vault:8200}
spring.cloud.vault.token=${SPRING_CLOUD_VAULT_TOKEN:root}

# Active profile (dev/prod) for conditional settings
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.backend=secret
spring.cloud.vault.kv.application-name=sb-ecom
spring.cloud.vault.kv.version=2
spring.cloud.compatibility-verifier.enabled=false


# --- Mail (SMTP) ---
# Credentials come from Vault (spring.mail.username / spring.mail.password).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Password reset
app.password-reset.token-expiration-minutes=15
app.email-verification.token-expiration-minutes=60

# File storage: local or s3 (MinIO/S3 compatible)
file.storage.provider=${FILE_STORAGE_PROVIDER:local}
minio.url=${MINIO_URL:http://localhost:9000}
minio.access.key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret.key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:images}
minio.public.url=${MINIO_PUBLIC_URL:http://localhost:9000}

# --- Stripe (Subscriptions) ---
stripe.secret.key=${STRIPE_SECRET_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}

# --- Automated refunds (see service.impl.RefundServiceImpl) ---
# When a return is marked refunded, record a PENDING refund and issue the Stripe
# refund through the outbox. Set false to fall back to the old behaviour — the
# order status still moves to Refunded, but the money is refunded by hand.
app.refunds.enabled=${REFUNDS_ENABLED:true}

# --- Subscription renewal sweep (see service.subscription) ---
# Backstop for subscription webhooks Stripe stopped retrying: reconciles any live
# subscription whose period ended over `grace-hours` ago against Stripe. Webhooks
# do the work in real time; this only catches the ones that went missing.
app.subscriptions.sweep.enabled=${SUBSCRIPTION_SWEEP_ENABLED:true}
app.subscriptions.sweep.interval-ms=${SUBSCRIPTION_SWEEP_INTERVAL_MS:3600000}
app.subscriptions.sweep.initial-delay-ms=${SUBSCRIPTION_SWEEP_INITIAL_DELAY_MS:300000}
app.subscriptions.sweep.grace-hours=${SUBSCRIPTION_SWEEP_GRACE_HOURS:24}

# --- Multi-currency (see service.currency) ---
# Every price is stored in `base` (USD); this is the currency the customer may
# choose to see and check out in. provider=fixed uses the fixed-rates table
# below only; provider=frankfurter adds the ECB feed and falls back to the table
# when it is unreachable. fixed-rates: units of the currency per one USD — keep
# roughly current, they are the floor under the live rates and the whole answer
# offline. The set here must be a subset of the codes seeded in V32.
app.currency.base=USD
app.currency.provider=${CURRENCY_PROVIDER:fixed}
app.currency.frankfurter.base-url=${CURRENCY_FRANKFURTER_URL:https://api.frankfurter.app}
app.currency.fixed-rates.EUR=${CURRENCY_RATE_EUR:0.92}
app.currency.fixed-rates.GBP=${CURRENCY_RATE_GBP:0.79}
app.currency.fixed-rates.CAD=${CURRENCY_RATE_CAD:1.36}
app.currency.fixed-rates.AUD=${CURRENCY_RATE_AUD:1.51}
app.currency.fixed-rates.RON=${CURRENCY_RATE_RON:4.57}
app.currency.fixed-rates.JPY=${CURRENCY_RATE_JPY:157}

# --- Spring Boot Actuator ---
# Credential for the Prometheus scrape (see actuatorFilterChain). /actuator/
# stays closed to everyone else — health and info aside — so the scraper
# authenticates rather than the endpoint being opened. No password means no
# account is created at all, so an unconfigured deployment fails closed.
app.metrics.scrape.username=${METRICS_SCRAPE_USER:prometheus}
app.metrics.scrape.password=${METRICS_SCRAPE_PASSWORD:}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoints.web.base-path=/actuator
management.metrics.tags.application=${spring.application.name}

# --- GraphQL (admin dashboards, optional alongside REST) ---
spring.graphql.path=/graphql
spring.graphql.graphiql.enabled=false
spring.graphql.websocket.enabled=false