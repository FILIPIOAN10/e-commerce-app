spring.application.name=sb-ecom
spring.cache.type=redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Postgres Sql
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/ecommerce}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
# No default: the password must be supplied via environment variable or Vault.
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# Flyway owns the schema; Hibernate only validates entity/table agreement.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.h2.console.enabled=false

# --- JPA / Hibernate performance ---
# Keep the persistence context out of the view layer: prevents connections being
# held for the whole request and surfaces lazy-loading bugs instead of hiding them.
spring.jpa.open-in-view=false
# Batch inserts/updates so saveAll() does not issue one statement per row.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true

# --- Connection pool (HikariCP) ---
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# --- Server ---
server.shutdown=graceful
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,application/javascript
server.compression.min-response-size=1024

# --- Flyway (schema versioning) ---
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
# Adopts a pre-existing (Hibernate-generated) schema: it is stamped at
# version 1 so V1 is skipped and migration continues from V2 onwards.
# A fresh database is empty, so it runs V1 normally instead.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing schema adopted from hibernate ddl-auto
spring.flyway.validate-on-migrate=true

project.image=images/

# Inventory reservation TTL in minutes (default 10 minutes)
inventory.reservation.ttl-minutes=10

# Supplied by Vault (spring.app.jwtSecret) or the JWT_SECRET environment variable.
# No default — the application refuses to start if the secret is not provided.
spring.app.jwtSecret=${JWT_SECRET}
spring.app.jwtExpirationMs=${JWT_EXPIRATION_MS:900000}
spring.ecom.app.jwtCookieName=springBootEcom
spring.ecom.app.refreshTokenCookieName=springBootEcomRefresh
spring.app.refreshTokenExpirationMs=${JWT_REFRESH_EXPIRATION_MS:604800000}

frontend.url=http://localhost:5173
image.base.url=http://localhost:8080/images

# Semantic product search
app.search.semantic.enabled=${APP_SEARCH_SEMANTIC_ENABLED:false}
app.search.semantic.top-k=${APP_SEARCH_SEMANTIC_TOP_K:20}
app.search.semantic.similarity-threshold=${APP_SEARCH_SEMANTIC_SIMILARITY_THRESHOLD:0.50}
spring.ai.model.embedding=${SPRING_AI_MODEL_EMBEDDING:none}
spring.ai.vectorstore.type=${SPRING_AI_VECTORSTORE_TYPE:none}
spring.ai.model.chat=${SPRING_AI_MODEL_CHAT:none}
spring.ai.model.image=${SPRING_AI_MODEL_IMAGE:none}
spring.ai.model.moderation=${SPRING_AI_MODEL_MODERATION:none}
spring.ai.model.chat.audio.speech=${SPRING_AI_MODEL_AUDIO_SPEECH:none}
spring.ai.model.chat.audio.transcription=${SPRING_AI_MODEL_AUDIO_TRANSCRIPTION:none}
spring.ai.openai.embedding.option.model=text-embedding-3-small
spring.ai.vectorstore.pgvector.initialize-schema=${SPRING_AI_VECTORSTORE_PGVECTOR_INITIALIZE_SCHEMA:true}
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.table-name=product_vector_store
spring.ai.openai.audio.speech.enabled=false

# Seed data now lives in Flyway migrations, not data.sql.
spring.sql.init.mode=${SQL_INIT_MODE:never}


spring.security.oauth2.client.registration.github.scope=read:user,user:email

# --- Multipart file upload ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# --- Spring Cloud Vault Configuration ---
# Vault import is in application-dev.properties to avoid loading
# the vault resolver during tests (incompatible with Spring Boot 4.x).
spring.cloud.vault.scheme=http
spring.cloud.vault.uri=${SPRING_CLOUD_VAULT_URI:http://vault:8200}
spring.cloud.vault.token=${SPRING_CLOUD_VAULT_TOKEN:root}

# Active profile (dev/prod) for conditional settings
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.cloud.vault.kv.enabled=true
spring.cloud.vault.kv.backend=secret
spring.cloud.vault.kv.application-name=sb-ecom
spring.cloud.vault.kv.version=2
spring.cloud.compatibility-verifier.enabled=false


# --- Mail (SMTP) ---
# Credentials come from Vault (spring.mail.username / spring.mail.password).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Password reset
app.password-reset.token-expiration-minutes=15
app.password-reset.frontend-url=http://localhost:5173
app.email-verification.token-expiration-minutes=60

# File storage: local or s3 (MinIO/S3 compatible)
file.storage.provider=${FILE_STORAGE_PROVIDER:local}
minio.url=${MINIO_URL:http://localhost:9000}
minio.access.key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret.key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:images}
minio.public.url=${MINIO_PUBLIC_URL:http://localhost:9000}

# --- Stripe (Subscriptions) ---
stripe.api.key=${STRIPE_API_KEY:}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}

# --- Spring Boot Actuator ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoints.web.base-path=/actuator
management.metrics.tags.application=${spring.application.name}