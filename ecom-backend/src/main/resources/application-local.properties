# ==========================================================
#  Local development profile  (docker-compose.yml default)
# ==========================================================
#  Same intent as application-prod.properties: every business
#  code path runs exactly as it does in production. Only
#  credentials and endpoints differ, and those come from .env.
#
#  What is turned OFF here is turned off because it cannot run
#  locally, not because it is inconvenient:
#    - HashiCorp Vault dev server is incompatible with Spring
#      Boot 4.1 config import in local Docker.
#    - Spring AI / pgvector semantic search has version
#      incompatibilities in this stack.
#  Rate limiting and email verification have no such excuse and
#  stay ON, so `docker compose up` exercises the same guards the
#  deployed app does. Override either through .env when needed
#  (e.g. RATE_LIMIT_ENABLED=false for a load test, or
#  APP_SKIP_VERIFICATION_EMAIL=true when no SMTP is available).
# ==========================================================

# --- Vault: not used locally; secrets come from .env / environment ---
spring.config.import=
spring.cloud.vault.enabled=false

# --- Real behaviour, like prod (base @Value defaults already match;
#     pinned here so the intent is explicit and env-overridable) ---
rate.limit.enabled=${RATE_LIMIT_ENABLED:true}
app.skip-verification-email=${APP_SKIP_VERIFICATION_EMAIL:false}

# --- Spring AI / semantic search: disabled locally (version incompatibility) ---
spring.ai.model.embedding=${SPRING_AI_MODEL_EMBEDDING:none}
spring.ai.vectorstore.type=${SPRING_AI_VECTORSTORE_TYPE:none}
spring.ai.model.chat=${SPRING_AI_MODEL_CHAT:none}
spring.ai.model.image=${SPRING_AI_MODEL_IMAGE:none}
spring.ai.model.moderation=${SPRING_AI_MODEL_MODERATION:none}
spring.ai.model.chat.audio.speech=${SPRING_AI_MODEL_AUDIO_SPEECH:none}
spring.ai.model.chat.audio.transcription=${SPRING_AI_MODEL_AUDIO_TRANSCRIPTION:none}

# --- Optional integrations: fall back to dummies so the context starts
#     without real credentials; override in .env to exercise the real flow ---
# Both StripeServiceImpl and SubscriptionServiceImpl read ${stripe.secret.key},
# fed from .env's STRIPE_SECRET_KEY. Dummy default keeps the context startable.
stripe.secret.key=${STRIPE_SECRET_KEY:sk_test_dummy_local_key}
# Matches the credential committed in monitoring/prometheus.yml so the
# monitoring profile scrapes out of the box. Production leaves this unset and
# gets no scrape account at all (see application.properties).
app.metrics.scrape.password=${METRICS_SCRAPE_PASSWORD:dummy-scrape-password}
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:dummy-github-id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:dummy-github-secret}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-google-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-google-secret}

# --- Mail: default to a local fake SMTP (maildev/mailhog on :1025) for bare
#     `java -jar` runs. docker-compose passes SPRING_MAIL_* from .env, which
#     overrides everything below. ---
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:local@example.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:dummy}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_STARTTLS:false}
