# ==========================================================
# Production profile
# ==========================================================
# This profile is intended for the docker-compose.prod.yml stack.
# It disables development-only features (Vault dev, AI, skip email)
# and relies on environment variables for all real credentials.

spring.config.import=
spring.cloud.vault.enabled=false
rate.limit.enabled=true
app.skip-verification-email=false

# Real SMTP settings must be supplied through the environment.
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}

# Disable semantic AI by default unless explicitly enabled.
spring.ai.model.embedding=${SPRING_AI_MODEL_EMBEDDING:none}
spring.ai.vectorstore.type=${SPRING_AI_VECTORSTORE_TYPE:none}
spring.ai.model.chat=${SPRING_AI_MODEL_CHAT:none}
spring.ai.model.image=${SPRING_AI_MODEL_IMAGE:none}
spring.ai.model.moderation=${SPRING_AI_MODEL_MODERATION:none}
spring.ai.model.chat.audio.speech=${SPRING_AI_MODEL_AUDIO_SPEECH:none}
spring.ai.model.chat.audio.transcription=${SPRING_AI_MODEL_AUDIO_TRANSCRIPTION:none}

# Flyway owns the schema in production; Hibernate must not create/drop it.
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.flyway.enabled=true

# --- API documentation ---
# /v3/api-docs/** and /swagger-ui/** are permitAll in the security config, which
# in production published the entire API surface — every route, parameter and
# schema — to anyone who asked. Disabling springdoc here is better than making
# the security rules profile-conditional: the endpoints stop existing, so there
# is nothing for a rule to get wrong.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
