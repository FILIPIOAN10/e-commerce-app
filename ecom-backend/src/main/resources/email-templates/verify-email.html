<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Verify Email</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; }
        .container { max-width: 500px; margin: auto; background: #fff; padding: 30px; border-radius: 8px; }
        .button { display: inline-block; background: #2e7d32; color: #fff; padding: 12px 24px; text-decoration: none; border-radius: 4px; margin: 16px 0; }
        .footer { color: #777; font-size: 12px; margin-top: 24px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Welcome!</h2>
        <p>Please verify your email address to activate your account. This link is valid for <strong>{{expires}} minutes</strong>.</p>
        <a href="{{link}}" class="button">Verify Email</a>
        <p class="footer">If you did not create an account, please ignore this email.</p>
    </div>
</body>
</html>
