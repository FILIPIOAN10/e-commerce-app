# ─────────────────────────────────────────────
#  Test profile — used with Testcontainers
# ─────────────────────────────────────────────
#  @ServiceConnection wires the container host/port
#  automatically, so we only need to disable
#  Vault and Spring AI here.
# ─────────────────────────────────────────────

# Disable Vault — tests don't need it
spring.config.import=
spring.cloud.vault.enabled=false
spring.autoconfigure.exclude=org.springframework.cloud.client.discovery.simple.SimpleDiscoveryClientAutoConfiguration,org.springframework.cloud.client.discovery.composite.CompositeDiscoveryClientAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration,org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration

# Disable Spring AI / pgvector vector store
spring.ai.model.embedding=none
spring.ai.vectorstore.type=none
spring.ai.model.chat=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.model.chat.audio.speech=none
spring.ai.model.chat.audio.transcription=none
spring.ai.vectorstore.pgvector.initialize-schema=false

# Flyway disabled in tests — Hibernate creates schema from entities
spring.flyway.enabled=false

# Hibernate creates the schema from entities for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Stripe — test key (not valid, just for context loading)
stripe.secret.key=sk_test_dummy_key_for_tests
stripe.webhook.secret=whsec_dummy

# Datasource password — Testcontainers @ServiceConnection overrides this
spring.datasource.password=test

# JWT test secret (Base64-encoded, >=32 bytes)
spring.app.jwtSecret=dGVzdC1zZWNyZXQta2V5LWZvci10ZXN0cy1vbmx5LWVub3VnaC1sb25n
spring.app.jwtExpirationMs=86400000
spring.ecom.app.jwtCookieName=springBootEcom

# Misc
frontend.url=http://localhost:5173
image.base.url=http://localhost:8080/images
spring.mail.host=
spring.mail.username=
spring.mail.password=

# Enable Hibernate statistics for N+1 query auditing
spring.jpa.properties.hibernate.generate_statistics=true

# Outbox dispatcher off: tests drive OutboxProcessor.processBatch() directly so
# delivery is deterministic and the poller never races assertions.
app.outbox.enabled=false

# Abandoned-cart sweep off: tests drive AbandonedCartSweepService.sweep() directly.
app.abandoned-cart.enabled=false

# Promo sweep off: PromoCampaignSweepJobTest drives the service directly, and a
# background pass would apply or revert a fixture campaign mid-assertion.
app.promo.enabled=false

# GDPR export purge off: tests drive GdprExportPurgeService.purgeExpired() directly.
app.gdpr.purge-enabled=false

# Stock reconciliation off: tests drive StockReconciliationService directly, and
# products persisted straight through the EntityManager legitimately have no
# ledger — a background sweep would log noise for every fixture.
app.stock.reconciliation-enabled=false

# Subscription renewal sweep off: tests drive SubscriptionReconciliationService
# directly, and it would otherwise reach out to Stripe for every fixture row.
app.subscriptions.sweep.enabled=false

# VAT off by default: the checkout/order integration tests assert exact totals
# that predate the tax line. OrderTaxTest turns it on with @SpringBootTest(properties=...).
app.tax.enabled=false

# Do not fail /actuator/health in tests when Redis is starting or missing
management.health.redis.enabled=false
management.health.mail.enabled=false

# OAuth2 — disabled in tests
spring.security.oauth2.client.registration.github.client-id=test
spring.security.oauth2.client.registration.github.client-secret=test
