services:
  redis:
    image: redis:7.4-alpine
    container_name: ecommerce-redis
    command: >
      sh -c "redis-server --requirepass \"$$REDIS_PASSWORD\"
      --appendonly yes
      --appendfsync everysec
      --save 60 1"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # Host port only: services reach Redis as redis:6379 on the compose network,
    # so this can be remapped freely when something else already holds 6379.
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

  postgres:
    image: pgvector/pgvector:0.8.2-pg16-trixie
    container_name: ecommerce-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required - see .env.example}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required - see .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - see .env.example}
    # Host port only: the backend connects to postgres:5432 inside the compose
    # network. Remap when a local Postgres install already owns 5432.
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-ecommerce}"]
      interval: 10s
      timeout: 5s
      retries: 5

  vault:
    image: hashicorp/vault:latest
    container_name: ecommerce-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:?VAULT_TOKEN is required - see .env.example}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 10s
      timeout: 5s
      retries: 5

  vault-init:
    image: hashicorp/vault:latest
    container_name: vault-init
    depends_on:
      vault:
        condition: service_healthy
    env_file:
      - .env
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: ${VAULT_TOKEN:?VAULT_TOKEN is required - see .env.example}
    volumes:
      - ./scripts/vault-init.sh:/vault-init.sh:ro
    entrypoint: ["/bin/sh", "/vault-init.sh"]

  backend:
    build:
      context: ./ecom-backend
    container_name: ecommerce-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      vault-init: # [MODIFICAT]: Acum backend-ul astepta ca scriptul de initiere Vault sa se termine cu succes
        condition: service_completed_successfully
    ports:
      - "8080:8080"
      - "5005:5005"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?POSTGRES_USER is required}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      # Flyway owns the schema. Hibernate only validates that entities match it.
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      # Remote debug (optional; disable in production)
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
      # data.sql is replaced by Flyway migrations (V2__seed_roles_and_users.sql)
      SQL_INIT_MODE: never
      SPRING_FLYWAY_ENABLED: "true"
      # 'local' profile: Vault and Spring AI stay off (both incompatible with
      # Spring Boot 4.1 in local Docker), but rate limiting and email
      # verification run exactly as in production. Override via .env.
      SPRING_PROFILES_ACTIVE: local
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}

      SPRING_CLOUD_VAULT_URI: http://vault:8200
      SPRING_CLOUD_VAULT_TOKEN: ${VAULT_TOKEN:?VAULT_TOKEN is required}
      SPRING_CLOUD_VAULT_KV_ENABLED: "true"
      SPRING_CLOUD_VAULT_KV_VERSION: "2"
      SPRING_CLOUD_VAULT_KV_BACKEND: "secret"
      SPRING_CLOUD_VAULT_KV_APPLICATION_NAME: "sb-ecom"
      # Mail credentials are injected from Vault (see scripts/vault-init.sh)

      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      METRICS_SCRAPE_PASSWORD: ${METRICS_SCRAPE_PASSWORD:-dummy-scrape-password}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      # OAuth2 credentials can be injected via .env for local social-login testing
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-dummy-github-id}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-dummy-github-secret}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dummy-google-id}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-dummy-google-secret}
      # Semantic search and AI are disabled in local ci profile to avoid version incompatibilities
      APP_SEARCH_SEMANTIC_ENABLED: "false"
      APP_SEARCH_SEMANTIC_TOP_K: ${APP_SEARCH_SEMANTIC_TOP_K:-20}
      APP_SEARCH_SEMANTIC_SIMILARITY_THRESHOLD: ${APP_SEARCH_SEMANTIC_SIMILARITY_THRESHOLD:-0.50}
      SPRING_AI_MODEL_EMBEDDING: none
      SPRING_AI_VECTORSTORE_TYPE: none
      SPRING_AI_MODEL_CHAT: ${SPRING_AI_MODEL_CHAT:-none}
      SPRING_AI_MODEL_IMAGE: ${SPRING_AI_MODEL_IMAGE:-none}
      SPRING_AI_MODEL_MODERATION: ${SPRING_AI_MODEL_MODERATION:-none}
      SPRING_AI_MODEL_AUDIO_SPEECH: ${SPRING_AI_MODEL_AUDIO_SPEECH:-none}
      SPRING_AI_MODEL_AUDIO_TRANSCRIPTION: ${SPRING_AI_MODEL_AUDIO_TRANSCRIPTION:-none}
      SPRING_AI_VECTORSTORE_PGVECTOR_INITIALIZE_SCHEMA: ${SPRING_AI_VECTORSTORE_PGVECTOR_INITIALIZE_SCHEMA:-true}
      SPRING_AI_VECTORSTORE_PGVECTOR_ID_TYPE: ${SPRING_AI_VECTORSTORE_PGVECTOR_ID_TYPE:-text}

      # Mail config: override via .env for real SMTP; defaults to local dummy settings
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-localhost}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-1025}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-ci@example.com}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-dummy-mail-password}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_AUTH:-false}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_STARTTLS:-false}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_REQUIRED: ${SPRING_MAIL_STARTTLS:-false}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT: ${SPRING_MAIL_CONNECTIONTIMEOUT:-10000}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT: ${SPRING_MAIL_TIMEOUT:-10000}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT: ${SPRING_MAIL_WRITETIMEOUT:-10000}
      SPRING_MAIL_PROPERTIES_MAIL_DEBUG: ${SPRING_MAIL_DEBUG:-false}
      # Real signup flow by default. Set APP_SKIP_VERIFICATION_EMAIL=true in .env
      # when you have no SMTP server (see .env.example).
      APP_SKIP_VERIFICATION_EMAIL: ${APP_SKIP_VERIFICATION_EMAIL:-false}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health >/dev/null 2>&1 || curl -sf http://localhost:8080/actuator/health >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    image: node:22-alpine
    container_name: ecommerce-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./ecom-frontend:/app
      - frontend-node_modules:/app/node_modules
    environment:
      VITE_BACK_END_URL: ${VITE_BACK_END_URL:-http://localhost:8080}
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 5173"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # --- Observability -------------------------------------------------------
  # Opt-in: `docker compose --profile monitoring up`. monitoring/ carried a
  # scrape config, alert rules and a dashboard that no compose file ever ran,
  # so none of it was reachable. Prometheus reaches the backend over the
  # default network; /actuator/prometheus is permitAll for exactly this.
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: ecommerce-prometheus
    profiles: [monitoring]
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.1
    container_name: ecommerce-grafana
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
  frontend-node_modules:
  prometheus-data:
  grafana-data: